name: CI

on:
  push:
    branches: [master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (serveur + interface)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests du serveur
        working-directory: server
        run: |
          pip install -r requirements-web.txt pytest==9.1.1 pytest-asyncio==1.4.0
          python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Typage et build de l'interface
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          npm run build

  web-image:
    name: Image Docker (version web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -f deploy/web/Dockerfile -t jarvis-web:ci .
      - name: Démarrage et santé
        run: |
          # Mot de passe trop court : la version hébergée doit refuser de démarrer.
          test "$(docker run --rm -e JARVIS_PASSWORD=court jarvis-web:ci >/dev/null 2>&1; echo $?)" != 0
          docker run -d --name jw -e JARVIS_PASSWORD=ci-mot-de-passe-long -p 127.0.0.1:8790:8765 jarvis-web:ci
          for i in $(seq 1 30); do curl -fs 127.0.0.1:8790/api/health && break; sleep 1; done
          curl -fs 127.0.0.1:8790/ | grep -q "J.A.R.V.I.S."
          test "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:8790/api/memories)" = 401
          docker stats --no-stream jw
          docker logs jw

  linux-app:
    name: Application Linux (.deb, .AppImage, .rpm)
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev patchelf file
      - name: Build
        env:
          PYTHON: python
          # Signature des artefacts de mise à jour (secret du dépôt, voir README).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./scripts/build-linux.sh
      - name: Panneau web autonome
        run: |
          mkdir -p dist-linux
          cp server/dist/jarvis_server dist-linux/jarvis-web-linux-x86_64
          cp client/src-tauri/target/release/bundle/deb/*.deb dist-linux/
          cp client/src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/
          cp client/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-linux/
          cp client/src-tauri/target/release/bundle/rpm/*.rpm dist-linux/
          cd dist-linux && sha256sum * > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-linux
          path: dist-linux/
      - name: Publier sur la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist-linux/*
